# XcodeGen spec. Run `xcodegen generate` on the Mac to create SwaraCoach.xcodeproj.
# (If XcodeGen is not available, follow Docs/LAB_CHECKLIST.md to create the project by hand instead.)
name: SwaraCoach
options:
  bundleIdPrefix: lk.swaracoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"                 # Swift 5 language mode: avoids strict-concurrency errors in audio callbacks
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  SwaraCoach:
    type: application
    platform: iOS
    sources: [SwaraCoach]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.swaracoach.app
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "SwaraCoach listens to your voice to show your pitch. Audio stays on your device."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: SwaraCoach
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  SwaraCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SwaraCoachTests]
    dependencies:
      - target: SwaraCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.swaracoach.tests
        GENERATE_INFOPLIST_FILE: YES
  SwaraCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SwaraCoachUITests]
    dependencies:
      - target: SwaraCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.swaracoach.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SwaraCoach:
    build:
      targets:
        SwaraCoach: all
    test:
      targets: [SwaraCoachTests, SwaraCoachUITests]
      gatherCoverageData: true
